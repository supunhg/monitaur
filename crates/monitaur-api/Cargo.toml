[package]
name = "monitaur-api"
version = "0.1.0"
edition = "2024"
description = "Shared API layer for Monitaur (CLI + Tauri)"

[dependencies]
monitaur-core = { path = "../monitaur-core" }
monitaur-discovery = { path = "../monitaur-discovery" }
monitaur-monitoring = { path = "../monitaur-monitoring" }
monitaur-security = { path = "../monitaur-security" }
monitaur-network = { path = "../monitaur-network" }
monitaur-visualization = { path = "../monitaur-visualization" }
monitaur-metadata = { path = "../monitaur-metadata" }
monitaur-persistence = { path = "../monitaur-persistence" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
rand_core = { version = "0.6", features = ["getrandom"] }
