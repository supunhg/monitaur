[workspace]
resolver = "2"
members = [
    "crates/monitaur-core",
    "crates/monitaur-discovery",
    "crates/monitaur-monitoring",
    "crates/monitaur-security",
    "crates/monitaur-network",
    "crates/monitaur-visualization",
    "crates/monitaur-metadata",
    "crates/monitaur-persistence",
    "crates/monitaur-api",
    "src-tauri",
]

[package]
name = "monitaur"
version = "0.1.0"
edition = "2024"
description = "Local-first infrastructure intelligence platform"

[dependencies]
monitaur-core = { path = "crates/monitaur-core" }
monitaur-discovery = { path = "crates/monitaur-discovery" }
monitaur-monitoring = { path = "crates/monitaur-monitoring" }
monitaur-security = { path = "crates/monitaur-security" }
monitaur-network = { path = "crates/monitaur-network" }
monitaur-visualization = { path = "crates/monitaur-visualization" }
monitaur-metadata = { path = "crates/monitaur-metadata" }
monitaur-persistence = { path = "crates/monitaur-persistence" }
monitaur-api = { path = "crates/monitaur-api" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 0
incremental = true
